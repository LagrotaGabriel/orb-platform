name: CI - Build, Test, Quality, Docker Build

on:
  push:
    branches:
      - develop
      - 'feature/*'

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: ⚙️ Maven build
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: 🔍 Run tests with JaCoCo coverage
        working-directory: ./backend
        run: mvn test

      - name: 📊 Generate JaCoCo coverage report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: 🚨 Verify minimal test coverage required
        working-directory: ./backend
        run: mvn jacoco:check

      - name: 🦸‍♂️ Run SonarCloud analysis
        working-directory: ./backend
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=LagrotaGabriel_orb-platform \
            -Dsonar.organization=lagrotagabriel \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:

      name: GitHub Packages Docker Build
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: GitHub Packages Docker Login
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker Image to GitHub Packages
          run: |
            docker build -t ghcr.io/${{ github.repository }}/myapp:${GITHUB_SHA} .

        - name: Push Docker Image to GitHub Packages
          run: |
            docker push ghcr.io/${{ github.repository }}/myapp:${GITHUB_SHA}