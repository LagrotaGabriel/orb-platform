name: CI - Build, Test, Quality, Docker Build

on:
  push:
    branches:
      - develop
      - "feature/*"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4
        
      - name: 🔍 Debug Git Checkout
        run: |
          git remote -v
          git status
          ls -la     

      - name: ☕ Setup JDK 17
        working-directory: ./backend
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: ⚙️ Maven build
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: 🔍 Run tests with JaCoCo coverage
        working-directory: ./backend
        run: mvn test

      - name: 📊 Generate JaCoCo coverage report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: 🚨 Verify minimal test coverage required
        working-directory: ./backend
        run: mvn clean verify

  docker-build:
    name: GitHub Packages Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛠️ Verificar estrutura do repositório
        run: |
          echo "Estrutura do repositório:"
          ls -la
          ls -la ./backend

      - name: GitHub Packages Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image to GitHub Packages
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -f ./backend/Dockerfile -t $IMAGE_NAME_LOWER/myapp:${GITHUB_SHA} ./backend

      - name: Push Docker Image to GitHub Packages
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push $IMAGE_NAME_LOWER/myapp:${GITHUB_SHA}
