name: CI - Build, Test, Quality, Docker Build (Monorepo Aware)

on:
  push:
    branches:
      - develop
      - "feature/*"
    paths:
      - "backend/**"
      - ".github/workflows/**"

jobs:
  build:
    name: 🧪 Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: ⚙️ Maven build
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: 🧐 Debug target directory contents
        run: |
          ls -la ./backend
          ls -la ./backend/target

      - name: 🔍 Run tests with JaCoCo coverage
        working-directory: ./backend
        run: mvn test

      - name: 📊 Generate JaCoCo coverage report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: 🚨 Verify minimal test coverage required
        working-directory: ./backend
        run: mvn clean verify

  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4

      - name: 🧾 Verificar estrutura do repositório
        run: |
          echo "Estrutura do repositório:"
          ls -la
          ls -la ./backend

      - name: 🔐 Login to GitHub Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧾 Debug backend and target directory contents
        run: |
           echo "Contents of backend directory:"
           ls -la ./backend
           echo "Contents of backend/target directory:"
           ls -la ./backend/target || echo "ERROR: Target directory does not exist!"

      - name: 🛑 Fail if JAR file is missing
        run: |
           JAR_FILE=$(find ./backend/target -name "*.jar" -type f)
           if [ -z "$JAR_FILE" ]; then
             echo "ERROR: JAR file is missing in target directory."
             exit 1
           else
             echo "JAR file found: $JAR_FILE"
           fi

      - name: 🏗️ Build Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -f ./backend/Dockerfile -t $IMAGE_NAME_LOWER/myapp:${GITHUB_SHA} ./backend

      - name: 📦 Push Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push $IMAGE_NAME_LOWER/myapp:${GITHUB_SHA}
