name: CI - Build, Test, Quality, Docker Build (Monorepo Aware)

on:
  push:
    branches:
      - develop
      - "feature/*"
    paths:
      - "backend/**"
      - ".github/workflows/**"

jobs:
  build:
    name: 🧪 Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: ⚙️ Maven build
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: 🔍 Run tests with JaCoCo coverage
        working-directory: ./backend
        run: mvn test

      - name: 📊 Generate JaCoCo coverage report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: 🚨 Verify minimal test coverage required
        working-directory: ./backend
        run: mvn clean verify

  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    env:
      COMPONENT: myapp
      CONTEXT: backend
      ENV: dev
      VERSION: ${{ github.sha }}

    steps:
      - name: 🛠️ Code checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: ⚙️ Maven build
        working-directory: ./backend
        run: mvn clean install -DskipTests

      - name: 🔐 Login to GitHub Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Docker Image
        run: |
          IMAGE_NAME="${COMPONENT}-${CONTEXT}"
          FULL_IMAGE_NAME="ghcr.io/${GITHUB_ACTOR}/${IMAGE_NAME}:${ENV}-${VERSION}"
          docker build -f ./backend/Dockerfile -t $FULL_IMAGE_NAME ./backend

      - name: 📦 Push Docker Image
        run: |
          IMAGE_NAME="${COMPONENT}-${CONTEXT}"
          FULL_IMAGE_NAME="ghcr.io/${GITHUB_ACTOR}/${IMAGE_NAME}:${ENV}-${VERSION}"
          docker push $FULL_IMAGE_NAME
